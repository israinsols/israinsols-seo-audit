name: Daily SEO draft generation

on:
  schedule:
    - cron: "15 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-draft-generation
  cancel-in-progress: false

jobs:
  generate-drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate one human-review draft
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_PASSWORD: ${{ secrets.WP_PASSWORD }}
          WP_AUTH_MODE: ${{ secrets.WP_USER != '' && secrets.WP_PASSWORD != '' && 'jwt' || 'file' }}
          AUTO_PUBLISH: "False"
          POSTS_PER_DAY: "1"
          REGION: PK
          REQUEST_TIMEOUT: "90"
        run: python main.py --generate --limit 1
      - name: Verify a draft was created
        run: |
          python - <<'PY'
          import sqlite3
          import sys

          connection = sqlite3.connect("data/engine.sqlite3")
          count = connection.execute(
              "SELECT COUNT(*) FROM articles WHERE status = 'draft'"
          ).fetchone()[0]
          connection.close()
          print(f"{count} draft(s) recorded.")
          sys.exit(0 if count else 1)
          PY
      - name: Upload file-mode drafts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-drafts-${{ github.run_id }}
          path: drafts/
          if-no-files-found: ignore
          retention-days: 14
