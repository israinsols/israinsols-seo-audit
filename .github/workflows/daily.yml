name: Daily SEO draft generation

on:
  schedule:
    - cron: "15 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-draft-generation
  cancel-in-progress: false

jobs:
  generate-drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Require WordPress draft credentials
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_PASSWORD: ${{ secrets.WP_PASSWORD }}
        run: |
          if [ -z "$WP_USER" ] || [ -z "$WP_PASSWORD" ]; then
            echo "::error::Set WP_USER and WP_PASSWORD in repository Actions secrets to create WordPress drafts."
            exit 1
          fi
      - name: Verify WordPress connection
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_PASSWORD: ${{ secrets.WP_PASSWORD }}
          WP_AUTH_MODE: jwt
          REQUEST_TIMEOUT: "90"
        run: python main.py --check-wp
      - name: Generate one article draft for human review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_PASSWORD: ${{ secrets.WP_PASSWORD }}
          WP_AUTH_MODE: jwt
          AUTO_PUBLISH: "False"
          POSTS_PER_DAY: "1"
          REGION: PK
          REQUEST_TIMEOUT: "90"
        run: python main.py --generate --limit 1
      - name: Verify a WordPress draft was created
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_PASSWORD: ${{ secrets.WP_PASSWORD }}
          WP_AUTH_MODE: jwt
          REQUEST_TIMEOUT: "90"
        run: |
          python - <<'PY'
          from config import load_settings
          from wp_client import WordPressClient
          import sqlite3
          import sys

          connection = sqlite3.connect("data/engine.sqlite3")
          row = connection.execute(
              "SELECT a.wp_post_id FROM articles a "
              "JOIN topics t ON t.id = a.topic_id "
              "WHERE a.status = 'draft' AND a.wp_post_id IS NOT NULL "
              "AND t.status = 'used' "
              "AND substr(a.created_at, 1, 10) = date('now') "
              "ORDER BY a.id DESC LIMIT 1"
          ).fetchone()
          connection.close()
          if row is None:
              sys.exit("No WordPress draft was recorded today.")
          post = WordPressClient(load_settings()).get_post(row[0])
          if post.get("status") != "draft":
              sys.exit(f"Expected WordPress draft status; received {post.get('status')!r}.")
          print(f"WordPress draft {row[0]} is ready for human review.")
          sys.exit(0)
          PY
      - name: Upload local fallback files if present
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-drafts-${{ github.run_id }}
          path: drafts/
          if-no-files-found: ignore
          retention-days: 14
