name: Daily SEO draft generation

on:
  schedule:
    - cron: "15 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-draft-generation
  cancel-in-progress: false

jobs:
  generate-drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Require WordPress publishing credentials
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_PASSWORD: ${{ secrets.WP_PASSWORD }}
        run: |
          if [ -z "$WP_USER" ] || [ -z "$WP_PASSWORD" ]; then
            echo "::error::Set WP_USER and WP_PASSWORD in repository Actions secrets before enabling live publication."
            exit 1
          fi
      - name: Verify WordPress connection
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_PASSWORD: ${{ secrets.WP_PASSWORD }}
          WP_AUTH_MODE: jwt
          REQUEST_TIMEOUT: "90"
        run: python main.py --check-wp
      - name: Generate and publish one article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_PASSWORD: ${{ secrets.WP_PASSWORD }}
          WP_AUTH_MODE: jwt
          AUTO_PUBLISH: "True"
          POSTS_PER_DAY: "1"
          REGION: PK
          REQUEST_TIMEOUT: "90"
        run: python main.py --generate --limit 1
      - name: Verify a live article was published
        run: |
          python - <<'PY'
          import sqlite3
          import sys

          connection = sqlite3.connect("data/engine.sqlite3")
          count = connection.execute(
              "SELECT COUNT(*) FROM articles a "
              "JOIN topics t ON t.id = a.topic_id "
              "WHERE a.status = 'published' AND a.wp_post_id IS NOT NULL "
              "AND t.status = 'used' "
              "AND substr(a.created_at, 1, 10) = date('now')"
          ).fetchone()[0]
          connection.close()
          print(f"{count} live published article(s) recorded.")
          sys.exit(0 if count else 1)
          PY
      - name: Upload local fallback files if present
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-drafts-${{ github.run_id }}
          path: drafts/
          if-no-files-found: ignore
          retention-days: 14
